name: Deploy API to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install Redis (verifies the rate-limit Lua script against a real server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      # A failing test must stop the deployment: there is deliberately no `|| true` here.
      - name: Run tests
        working-directory: backend
        run: pytest -q
        env:
          REQUIRE_REDIS: '1'

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
