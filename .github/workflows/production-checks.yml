name: Production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts
      - name: Dependency vulnerability audit (fails on any known vulnerability)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Install Redis (verifies the rate-limit Lua script against a real server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - run: pytest -q
        env:
          REQUIRE_REDIS: '1'
