name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # The pinned numpy/scikit-learn versions are only buildable on the Python version the service runs
    # (backend/.python-version). Test on exactly that version.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install Redis (verifies the rate-limit Lua script against a real server)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server
      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
        env:
          REQUIRE_REDIS: '1'
